	<script type="text/javascript">
		$(function(){
			$('.familySite').on('click', function(){
				if($(this).hasClass('on')){
					$(this).removeClass('on');
					$(".footSelect > ul").slideUp();
				}else{
					$(this).addClass('on');
					$(".footSelect > ul").slideDown();
				}
			});
			$(document).click(function(event) {
				if (!$(event.target).closest('.familySite').length) {
					$('.familySite').removeClass('on');
					$(".footSelect > ul").slideUp();
				}
			});
		});
	</script>
