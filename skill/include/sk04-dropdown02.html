	<script type="text/javascript">
		$(function(){
			var $cs = $(".custom_select"),
				$sca = $(".custom_select > a");
			var drt = 200;
			if( $cs.length > 0 ){
				$cs.each(function(){
					var _default = $(this).find(".helper");
					$(this).children("a").on("click",function(e){
						e.preventDefault();
						var _ = $(this),
							_opt = _.parent(".custom_select").find(".opt_list");
						_opta = _opt.children("li").children("a");
						_.parent(".custom_select").addClass("on");
						if( _opt.css("display") != "block" ){
							setTimeout(function(){
								_opt.stop().slideDown(drt);
							}, drt);
						}else if ( _opt.css("display") == "block" ){
							_opt.stop().slideUp(drt,function(){
								_.parent(".custom_select").removeClass("on");
							});
						}
						_.parent(".custom_select").parent(".header_util__input_box").toggleClass("on");

						_opta.on("click",function(e){
							e.preventDefault();

							var _ = $(this);
							var _link = _.attr("href");
							var _val = _.html();
							//console.log(_default.text() + "  ==?   " + _val);
							//console.log(_default.text() == _val);
							_.parents(".custom_select").children("a").html("<span class='helper'>"+_val+"</span>");
							_.parents(".custom_select").children("a").attr("href", _link );

							_opt.stop().slideUp(drt,function(){
								if( _default.text() != _val && _opt.children(".default").length == 0 ){
									// _opt.prepend("<li class='default'><a href='#'>" + _default.html() + "</a></li>");
								}
								_.parents(".custom_select").removeClass("on");
							});
							$(".header_util__input_box").removeClass("on");
						});
					});
					if( $(this).next(".relatedsite_btn").length > 0 ){
						var $smoveb = $(".relatedsite_btn");
						$smoveb.on("click",function(e){
							e.preventDefault();
							var _ = $(this);
							var _link = _.prev(".relatedsites_wrap").children("a").attr("href");
							if( _link != "#" ){
								window.open( _link , '_blank');
							}
						});
					}
				});
			}
		});
	</script>
