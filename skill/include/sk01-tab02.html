	<script type="text/javascript">
		$(function(){
			$('.sub-tab-wrap').each(function(){
				var _this = $(this);
				var _btn = _this.find('.sub-tab > ul li a');
				_btn.on('click', function(e){
					e.preventDefault();
					var i = $(this).attr('class');
					i = i.replace(/\s+/g, '').split('on');
					i = i[0];
					_btn.not(this).removeClass('on');
					$(this).addClass('on');
					_this.find('.sub-tab__conts > ul > li:not(.' + i + ')').hide();
					_this.find('.sub-tab__conts > ul > li.' + i).fadeIn(200);
				});
			});

			AOS.init();
		});
	</script>
